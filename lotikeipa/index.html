<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<meta name="format-detection" content="telephone=no, address=no, email=no">

* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }

html { height: 100%; }
body {
  /* Real app uses NotoSansJP-Bold / NotoSansJP-Regular (extracted from Font assets in libil2cpp). */
  font-family: 'Noto Sans JP','Hiragino Sans','Yu Gothic Medium','YuGothic','Meiryo',-apple-system,sans-serif;
  background: #000;
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100dvh;
  overflow: visible;
}

/* ===== PHONE SHELL ===== */
.phone {
  width: 100%;
  height: 100dvh;
  background: #e5e5e5;
  position: relative;
  border-radius: 0;
  box-shadow: none;
  overflow: visible;
  display: flex;
  flex-direction: column;
}

/* ===== STATUS BAR ===== */


.status-icons { display: flex; gap: 5px; align-items: center; }
.status-icons svg { fill: white; }

/* ===== HEADER ===== */
.header {
  position: absolute;
  top: 0; left: 0; right: 0;
  z-index: 15;
  display: flex;
  justify-content: space-between;
  align-items: center;
  /* 実機ヘッダーはiOSステータスバー下に来る（実測ロゴ top≈60px, left≈8px）。
     env(safe-area-inset-top) が0になる環境(デスクトップ描画等)でもステータスバー相当の
     最小44pxを確保し、実機と同じ位置に。左は8pxに。 */
  padding: calc(max(env(safe-area-inset-top, 0px), 28px)) 16px 14px 8px;
  pointer-events: none;
}
.logo-area {
  display: flex;
  align-items: center;
  gap: 5px;
  pointer-events: none;
}
.header-left {
  display: flex;
  align-items: center;
  gap: 5px;
  pointer-events: none;
}
/* Oロゴ: 画像のみ */
/* 実機アセット Texture2D/header_logo.png（O＋ーチケ＋LAWSON TICKET が1枚に入った白ロゴ, 元108×44）。
   実機ヘッダー実測で幅≈56px。白画像なので青ヒーロー上にそのまま重ねる（filter不要）。 */
.header-logo {
  width: 60px;
  height: auto;
  display: block;
  flex-shrink: 0;
}
/* Unity Header/Title Text: NotoSansJP-Regular size 32, color #DAECF8 (extracted from libil2cpp). */
.header-title {
  color: #DAECF8;
  font-size: 19px;
  font-weight: 400;
  font-family: 'Noto Sans JP','Hiragino Sans',sans-serif;
  margin-left: 8px;
}
.header-icons { display: flex; gap: 17px; pointer-events: auto; }
.header-icons svg { fill: white; width: 27px; height: 27px; }

/* IPA NetworkCheckBar: BAR_HEIGHT=40, background Image.color
   (0.964706, 0.305882, 0.513726, 1), Text rect 362x40,
   offline_exclamation 23x23. */
.network-check-bar {
  position: absolute;
  z-index: 16;
  top: calc(env(safe-area-inset-top, 0px) + min(12.222222vw, 52.555556px));
  left: 0;
  width: 100%;
  height: min(5.555556vw, 23.888889px);
  background: rgb(246, 78, 131);
  color: #fff;
  display: none;
  align-items: center;
  justify-content: center;
  pointer-events: none;
}
.network-check-bar.is-visible { display: flex; }
.network-check-message {
  position: relative;
  width: min(50.277778vw, 216.194444px);
  height: min(5.555556vw, 23.888889px);
  display: flex;
  align-items: center;
  justify-content: center;
  white-space: nowrap;
  font-family: 'Noto Sans JP','Hiragino Sans',sans-serif;
  font-size: min(2.916667vw, 12.541667px);
  font-weight: 400;
  line-height: 1;
}
.network-check-message img {
  width: min(3.194444vw, 13.736111px);
  height: min(3.194444vw, 13.736111px);
  margin-right: min(1.388889vw, 5.972222px);
  flex: 0 0 auto;
}

/* ===== HERO ===== */
.hero {
  width: 100%;
  /* 実機のヒーロー＝画面高さの約31.2%(実測 263.7/844)。固定pxだと iPhone 15 Pro Max など
     縦の長い画面で相対的に短く見えるため、画面高さ比(dvh)で指定し実機比率を保つ。 */
  height: 290px;        /* dvh非対応時のフォールバック */
  height: 31.2dvh;
  /* Real app hero rendering reconstructed from Unity:
     Layer 1: solid color #039FDC (HeaderBG/Background m_Color, extracted from libil2cpp).
     Layer 2: entry_bg_gradation sprite tinted #000066 (HeaderBG/Background/Gradation m_Color),
              composited over Layer 1 with normal blending. Already baked into the PNG below. */
  background: url('./lawtikemoc2-ipa-assets/ipa-hero-background.png') #039FDC center/100% 100% no-repeat;
  position: relative;
  overflow: hidden;
  flex-shrink: 0;
}

/* Hero background variants: the original keeps the supplied blue gradation,
   while the other three deliberately remove it and use a flat color. */
.hero.hero-theme-original {
  background-color: transparent;
  background-blend-mode: normal;
}
.hero.hero-theme-cyan {
  background-color: #00e4e4;
  background-image: none;
}
.hero.hero-theme-white {
  background-color: #d8d8d8;
  background-image: none;
}
.hero.hero-theme-orange {
  background-color: #ff9800;
  background-image: none;
}
.hero.hero-theme-red {
  background-color: #fe748d;
  background-image: none;
}
.hero.hero-theme-green {
  background-color: #00ff00;
  background-image: none;
}
.hero:is(.hero-theme-cyan,.hero-theme-orange,.hero-theme-white,.hero-theme-red,.hero-theme-green) :is(.event-title,.event-date,.event-time) {
  color: #111;
}
.hero-theme-picker {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 9px;
  margin-bottom: 20px;
}
.hero-theme-option {
  appearance: none;
  border: 2px solid transparent;
  border-radius: 10px;
  background: #f3f3f3;
  color: #333;
  cursor: pointer;
  font: inherit;
  font-size: 13px;
  font-weight: 700;
  padding: 8px 5px;
}
.hero-theme-option::before {
  content: "";
  display: block;
  width: 100%;
  height: 32px;
  margin-bottom: 6px;
  border-radius: 7px;
  background: var(--theme-swatch);
  box-shadow: inset 0 0 0 1px rgba(0,0,0,.08);
}
.hero-theme-option.is-active {
  border-color: #1769aa;
  background: #eef7fd;
  color: #1769aa;
}
.seat-number-stepper {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  margin: -4px 0 14px;
}
.seat-number-stepper button {
  appearance: none;
  min-height: 42px;
  border: 1px solid #c8d9e7;
  border-radius: 9px;
  background: #eef7fd;
  color: #1769aa;
  cursor: pointer;
  font: inherit;
  font-size: 21px;
  font-weight: 700;
  line-height: 1;
}
.seat-number-stepper button:active {
  background: #d9edf9;
  transform: translateY(1px);
}

/* Rainbow rect behind circles - shown only when selected */
.circles-rainbow-bg {
  position: absolute;
  top: min(12.2222vw, 52.56px);
  left: 0;
  width: 100%;
  height: min(43.3333vw, 186.33px);
  border-radius: 0;
  z-index: 6;
  display: none;
  /* iOS 2.1.47 Texture2D/entry_swipe_gradation (720x312)を直接使用。
     Sprite自体はalpha=255、SwipeImageのUnity UI Image tintは
     RGBA=(1,1,1,0.9019608)＝230/255。 */
  background: url("./lawtikemoc2-ipa-assets/entry_swipe_gradation_ios.png") center / 100% 100% no-repeat;
  opacity: 0.9019608;
}

/* Unity ScreenEntry.SwipeImage / SwipeImageRT 相当。
   券面・公演情報とは独立した最前面の入場操作レイヤーだけを移動する。 */
.swipe-bar-layer {
  position: absolute;
  inset: 0;
  z-index: 8;
  pointer-events: none;
}

/* ScreenEntry.SwipeImage: touch-down時だけ有効になる画面最前面の独立Image。 */
.swipe-image-layer {
  position: fixed;
  inset: 0;
  z-index: 150;
  display: none;
  overflow: hidden;
  pointer-events: none;
  transform: translate3d(0,0,0);
  will-change: transform;
}
.swipe-image-layer.is-active { display: block; }
.swipe-image-capture {
  position: absolute;
  left: 0;
  width: 100%;
}


/*
 * Hero copy-protect ripple — values extracted from libil2cpp.so via Il2CppDumper.
 *   Source: ScreenEntry.CopyProtectAnimation()  RVA 0xE57C34 (APK 2.1.47)
 *   Library: LeanTween
 *
 *   Per wave (lifetime = 2.0s):
 *     localScale: (0.02, 0.02, 0)  → tween → Vector2.one  over 2.0s, EaseOutQuad
 *     color:      Color(1,1,1,0.5) → alpha → 0.30         over 2.0s, Linear
 *     onComplete: DestroyImmediate(clone)
 *   Spawn cadence: 1.0s (moveLocalX 0→0 over 1.0s used as a timer that re-invokes the method)
 *   → at any moment 2 overlapping waves are visible.
 *
 *   LogoO sprite is 1265 × 1069 in a 720-wide canvas → at scale 1.0 it overflows the
 *   400-tall CopyProtect area (intentionally clipped).
 */
.ripple-container {
  /* must span the full hero so .ripple-ring's % width resolves correctly. */
  position: absolute;
  top: 0; left: 0;
  width: 100%; height: 100%;
  z-index: 2;
  pointer-events: none;
}
.ripple-ring {
  position: absolute;
  top: 50%; left: 50%;
  /* IPA: logo_O=1265px、基準Canvas幅=720px。1265 / 720 * 100。 */
  width: 175.694444%;
  aspect-ratio: 1265 / 1069;
  -webkit-mask-image: url('./lawtikemoc2-ipa-assets/ticket-card-mask.png');
          mask-image: url('./lawtikemoc2-ipa-assets/ticket-card-mask.png');
  -webkit-mask-size: contain;
          mask-size: contain;
  -webkit-mask-repeat: no-repeat;
          mask-repeat: no-repeat;
  -webkit-mask-position: center;
          mask-position: center;
  /* The root IPA sprite supplies the normal/used card face. */
  background: transparent;
  /* base state == animation start (Unity): scale 0.02。alphaはkeyframeで0.10から開始。 */
  transform: translate(-50%, -50%) scale(0.02);
  opacity: 1;
  /* APK 2.1.47 libil2cpp.so confirmed (RVA 0xE57C34):
       LeanTween.scale → Vector2.one   over 2.0s, setEaseOutQuad
       LeanTween.alpha → 0.30          over 2.0s, setEaseLinear
       LeanTween.moveLocalX            over 1.0s, onComplete → re-invoke (respawn)
     → wave lifetime 2.0s, respawn cadence 1.0s, so exactly 2 waves overlap.
     timing-function is linear because EaseOutQuad is baked into the keyframe stops below
     (the previous cubic-bezier approximation grew too gently early → read as "slow"). */
  animation:
    rippleScale 2s linear forwards,
    rippleAlpha 2s linear forwards;
  animation-delay: 0s, 0s;
}

/* EaseOutQuad sampled f(t)=2t-t², scale = 0.02 + 0.98*f(t). */
@keyframes rippleScale {
  0%   { transform: translate(-50%, -50%) scale(0.020); }
  10%  { transform: translate(-50%, -50%) scale(0.206); }
  20%  { transform: translate(-50%, -50%) scale(0.373); }
  30%  { transform: translate(-50%, -50%) scale(0.520); }
  40%  { transform: translate(-50%, -50%) scale(0.647); }
  50%  { transform: translate(-50%, -50%) scale(0.755); }
  60%  { transform: translate(-50%, -50%) scale(0.843); }
  70%  { transform: translate(-50%, -50%) scale(0.912); }
  80%  { transform: translate(-50%, -50%) scale(0.961); }
  90%  { transform: translate(-50%, -50%) scale(0.990); }
  100% { transform: translate(-50%, -50%) scale(1.000); }
}
@keyframes rippleAlpha {
  /* APK 2.1.47: Color(1,1,1,0.5), then LeanTween.alpha to 0.30 over 2.0s Linear. */
  from { opacity: 0.50; }
  to   { opacity: 0.30; }
}

/* Wavy circles */
.wavy-wrap {
  position: absolute;
  z-index: 7;
  border-radius: 50%;
  overflow: hidden;
  display: none;
  width: min(16.6667vw, 71.67px); height: min(16.6667vw, 71.67px);
  background: transparent;
}
.wavy-wrap.white-fill {
  background: transparent;
}
.wavy-left  { top: min(25.5556vw, 109.89px); left: calc(30.55% - min(8.3333vw, 35.84px)); }
.wavy-right { top: min(25.5556vw, 109.89px); left: calc(69.45% - min(8.3333vw, 35.84px)); }
/* 二点ポインターの波線は実機アセット Texture2D/entry_finger_print.png（白シェブロン円, 120×120）を
   そのままマスクに使用。縦横の山の数・二重線の見え方まで実機と完全一致。
   色は背景で切替: 選択中=ピンク(#FF4081) / スライド中=白。隙間はヒーロー地が透ける。 */
.wavy-fill {
  width: 100%; height: 100%;
  background: #FF4081;
  -webkit-mask-image: url('./lawtikemoc2-ipa-assets/ticket-wave-mask.png');
          mask-image: url('./lawtikemoc2-ipa-assets/ticket-wave-mask.png');
  -webkit-mask-size: contain;   mask-size: contain;
  -webkit-mask-repeat: no-repeat; mask-repeat: no-repeat;
  -webkit-mask-position: center;  mask-position: center;
}
.wavy-wrap.white-fill .wavy-fill { background: #ffffff; }

/* Blue gradient overlay for slide animation */
.hero-slide-bg {
  display: none;
}

/* Invisible slide overlay */
.slide-overlay {
  display: none !important;
}
.slide-track { opacity: 0; position: absolute; width: 252px; height: 36px;
  bottom: 16px; left: 50%; transform: translateX(-50%); }
.slide-thumb { width: 28px; height: 28px; background: white; border-radius: 50%;
  position: relative; left: 0; flex-shrink: 0; }

/* IDOLY PRIDE title - top-left under header */
.event-title {
  position: absolute;
  top: 120px; left: 8px;
  color: white;
  /* 実機タイトルの「Ｉ」のスラブセリフ・幾何学的な丸み・広い字間は【全角英字】の特徴。
     コード(Unity TitleText: NotoSansJP-Bold size40=約20px)どおり NotoSansJP-Bold で、
     文字列を全角(ＩＤＯＬＹ　ＰＲＩＤＥ)にすると実機と一致する。全角自体が広いので字間は最小。 */
  font-family: 'Noto Sans JP','Hiragino Sans',sans-serif;
  font-size: 22px; font-weight: 700; letter-spacing: 1.1px;
  z-index: 5; pointer-events: none;
}
/* Unity Date/Time Text: NotoSansJP-Bold size 32 (extracted from libil2cpp). */
.event-date, .event-time {
  position: absolute; left: 8px;
  color: white; font-size: 18px; font-weight: 700; line-height: 20px;
  font-family: 'Noto Sans JP','Hiragino Sans',sans-serif;
  z-index: 5; display: flex; align-items: center; gap: 7px;
  pointer-events: none;
}
/* カレンダー(日付)はもう少し下へ。時計＋開場開演時間は下端寄せのまま（ヒーロー最下部）。 */
/* 日付と開場/開演の余白を実機(約12px)に拡大: 日付を少し上げる。時刻は下端寄せのまま。 */
.event-date { bottom: 38px; }
.event-time { bottom: 10px; }
/* 実機アセット Texture2D/entry_icon_date.png・entry_icon_time.png（白, 元36×36, 透明余白あり）。青ヒーロー上に白でそのまま。
   実機の字形は約15px。元画像に透明余白があるため18px指定で字形≈15pxに合わせる。 */
.event-date img, .event-time img { width: 18px; height: 18px; display: block; flex-shrink: 0; transform: translateY(1px); }

/* ===== WARNING BANNER ===== */
.warning-banner {
  background: #ff0000; color: white;
  font-size: 14.5px; line-height: 1.35; font-weight: 700;
  font-family: 'Noto Sans JP','Hiragino Sans',sans-serif;
  padding: 7px 10px 8px;
  display: none; flex-shrink: 0;
}

/* ===== TICKET AREA ===== */
.ticket-section { padding: 33px 9px 16px; background: #e5e5e5; flex: 1; flex-grow: 1; min-height: 200px;
  overflow-y: auto;
}

.ticket-header {
  display: flex; justify-content: space-between; align-items: center;
  margin-bottom: 11px;
}
/* 実機計測: 「お手持ちのチケット」「合計X枚」の字高 ≈19px → font-size 20px（旧24pxは大きすぎ）。 */
.ticket-header span { font-size: 22px; color: #171513; font-family: 'Noto Sans JP','Hiragino Sans',sans-serif; font-weight: 400; line-height: 1.1; }

/* IPA: the ticket shadow is baked into the 9-sliced ticket_base_white sprite.
   There is no Unity Shadow/Outline component on EnterTicketItem. */
.ticket-card {
  background: transparent;
  overflow: visible;
  position: relative;
  /* IPA EnterTicketItem RectTransform: width=712, anchoredPosition.x=4 on
     the 720-wide Canvas. The sprite's own transparent rim supplies the
     visible outer margin; the card box must not reuse ticket-section's 9px. */
  width: min(98.888889vw, 425.2222px);
  margin-left: calc(min(0.555556vw, 2.3889px) - 9px);
  filter: none;
  transition: background 0.3s;
}
/* Exact IPA/Android 2.1.47 asset (pixel-identical): 176x64,
   Unity Sprite.border = left 30, bottom 30, right 141, top 30.
   The root Image and content Mask share one RectTransform. The sprite's transparent
   rim and baked shadow are therefore used without expanding this layer. */
.ticket-card::before {
  content: '';
  position: absolute;
  /* The root Image and child Mask share the same RectTransform. Expanding this
     layer duplicates the sprite's built-in 12px transparent/shadow rim. */
  inset: 0;
  z-index: 0;
  pointer-events: none;
  /* Shadow-only channel derived from the IPA sprite:
     alpha = source alpha * (1 - source luminance). The white face is transparent,
     so the upper Mask's notches continue to expose the page background. */
  border-style: solid;
  /* border-image の透明画素からCSS既定のボーダー色が見えないようにする。
     IPA側に存在するのはスプライト内蔵の輪郭と影だけ。 */
  border-color: transparent;
  border-width:
    min(4.166667vw, 17.9167px)
    min(19.583333vw, 84.2083px)
    min(4.166667vw, 17.9167px)
    min(4.166667vw, 17.9167px);
  /* Legacy generated shadow source disabled. The IPA sprite below is authoritative.
  border-image-source: url('./lawtikemoc2-ipa-assets/ticket-border-shadow.png');
  */
  /* Use the IPA sprite itself for the root Image. This supplies its native
     face alpha and baked shadow; no generated shadow channel is needed. */
  border-image-source: url('./lawtikemoc2-ipa-assets/ticket_base_white.png');
  border-image-slice: 30 141 30 30 fill;
  border-image-repeat: stretch;
}
/* ticket_base_white_used is fully opaque at its texture corners when exported
   (RGBA 255,255,255,255), although Unity clips the visible card face with the
   sibling ticket_base_mask. Drawing it directly as a CSS border-image exposes
   that texture rectangle. Keep the IPA normal frame/shadow here and apply the
   used-state face colour through the same serialized mask below. */
.ticket-card.entered::before {
  border-image-source: url('./lawtikemoc2-ipa-assets/ticket_base_white.png');
}
/* inner clip for background color */
.ticket-inner {
  border-radius: 0;
  overflow: hidden;
  position: relative;
  background: transparent;
  z-index: 1;
  /* IPA EnterTicketItem/Mask Image reference: ticket_base_mask. */
  -webkit-mask-box-image-source: url('./lawtikemoc2-ipa-assets/ticket_base_mask.png');
  -webkit-mask-box-image-slice: 30 141 30 30 fill;
  -webkit-mask-box-image-width:
    min(4.166667vw, 17.9167px)
    min(19.583333vw, 84.2083px)
    min(4.166667vw, 17.9167px)
    min(4.166667vw, 17.9167px);
  -webkit-mask-box-image-repeat: stretch;
}
/* Selected state: Zashu(seat) + main row both turn blue. Footer stays white.
   Implementation matches Unity behavior — the dashed-line/notch separator only sits between
   info and footer, so the entire upper area (seat + main) is one continuous blue region. */
.ticket-card.selected .ticket-inner { background: transparent; }
.ticket-card.selected .ticket-type,
.ticket-card.selected .ticket-main { background: #0074bc; }
.ticket-card.selected .ticket-footer { background: transparent !important; }
.ticket-footer { border-top: 1px solid #d8d8d8; }

/* 入場済 stamp — Unity Entered (pid=1885):
   size=340x112 at pos (-13,-13) anchor(1,1) pivot(1,1), rotation=identity (sprite art is pre-skewed).
   Card width 712 → stamp width 340/712 = 47.7%. Inset 13/2 = 6.5px from each edge.
   Color rgba(255,64,129, 0.502) → opacity 0.5. */
.nyujozumi-stamp {
  position: absolute;
  top: 2px;
  right: 1px;
  width: 51.5%;
  height: auto;
  pointer-events: none;
  display: none;
  z-index: 10;
  /* 実機画像から抽出した入場済文字の中央値 #f093b2 をPNGへ直接反映。
     CSSフィルタではなく画像自体のRGBを合わせる。 */
  opacity: 1;
  filter: none;
}

.ticket-main {
  padding: 11px 0 15px 15px;
  display: flex; align-items: center; gap: 10px;
  cursor: pointer; user-select: none;
  transition: background 0.3s;
  position: relative;
}
/* Unity Zashu Text (pid=2529): NotoSansJP-Regular 32 #323232, pos.x=114 width=512 in 712-wide card.
   Standalone top row of the card; text is centered within its rect. */
/* 実機: 「１Ｆ 全自由 ＜チケットのみ＞」は中央寄せではなく、整理番号・氏名と同じ左端(情報列, 約67px)に左寄せ。 */
.ticket-type {
  font-size: 18px;
  line-height: 1.18;
  color: #323232;
  text-align: left;
  padding: 0;
  margin: 0 0 2px 0;
  font-family: 'Noto Sans JP','Hiragino Sans',sans-serif;
  font-weight: 400;
  transition: color 0.3s;
  position: relative;
  white-space: nowrap;
  overflow: visible;
  width: calc(100% + 58px);
}
.ticket-type.secondary {
  padding: 0;
  margin-top: 0;
  margin-bottom: 2px;
}
.ticket-type.secondary:empty {
  display: none;
}
.ticket-card.selected .ticket-type { color: rgba(255,255,255,0.95); }

/* Unity StatusIcon Text: NotoSansJP-Bold size 20, color #005186 (extracted from libil2cpp). */
/* 実機: アバター⌀≈38px。情報ブロック全体の中央ではなく上部(整理番号の高さ)に左寄せで配置。
   → align-self:flex-start で行の上側へ。整理番号の行に視覚的に合うよう少しだけ下げる。 */
.avatar-circle {
  width: 38px; height: 38px;
  border: 1px solid #005186; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 12px; color: #005186; font-weight: 700;
  font-family: 'Noto Sans JP','Hiragino Sans',sans-serif;
  white-space: nowrap; line-height: 1; letter-spacing: -0.5px; transform: none;
  flex-shrink: 0;
  background: #fff;
  transition: background 0.3s;
  /* 価格下の横線より上の範囲全体で上下中央に配置。
     チェック欄も同じ中心線に合わせる。 */
  align-self: center;
  margin-top: 0;
}
/* アバター内側の背景は周囲の地色に追従（未選択=白 / 選択=青 / 入場済=グレー）。 */
.ticket-card.selected .avatar-circle { background: #0074bc; border-color: white; color: white; }
.ticket-card.entered .avatar-circle {
  /* ticket_base_white_used opaque face pixel: RGBA(230,230,230,255). */
  background: #e6e6e6 !important;
  opacity: 1;
  transition: none;
}

.ticket-info { flex: 1; min-width: 0; padding-right: 8px; }
/* Unity SheatNum Text: NotoSansJP-Bold size 40, color #323232 (extracted from libil2cpp). */
/* 実機比率(整理番号:席種:氏名 ≈ 1.0:0.8:0.57, code 40:32:24 と一致)に合わせ整理番号を22pxに。 */
.ticket-number {
  font-size: 22px; font-weight: 700; color: #323232; margin: 0 0 1px 0;
  letter-spacing: -0.5px;
  font-family: 'Noto Sans JP','Hiragino Sans',sans-serif;
}
.ticket-card.selected .ticket-main .ticket-number { color: white; }
/* Unity Name/PhoneNum/Price Text: all NotoSansJP-Regular size 24, color #323232 (extracted from libil2cpp). */
/* 実機比率: 氏名/電話/金額 ≈ 整理番号×0.57 → 13px（旧15は大きすぎ）。 */
.ticket-detail { font-size: 14px; color: #323232; line-height: 1.34; letter-spacing: -0.2px; font-family: 'Noto Sans JP','Hiragino Sans',sans-serif; font-weight: 400; }
.ticket-card.selected .ticket-main .ticket-detail { color: rgba(255,255,255,0.9); }
.entry-time {
  display: block;
  font-size: 14px;
  line-height: 1.34;
}

/* 右端のチェックボックス領域 - デフォルトは透明、選択時に青 */
.checkbox-zone {
  width: 67px;
  background: transparent;
  display: flex;
  align-items: center;       /* 「あなた」と中心線を合わせる */
  justify-content: center;
  flex-shrink: 0;
  align-self: stretch;
  transition: background 0.25s;
}
.checkbox-zone.hidden { display: none; }

/* 選択時：青ゾーン背景を表示 */
.ticket-card.selected .checkbox-zone {
  background: #0074bc;
}

/* チェックボックス本体：未選択時は白背景＋グレー枠 */
.checkbox {
  width: 24px; height: 24px;
  border: 3.5px solid #c5c5c5;
  border-radius: 4px;
  background: white;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
  margin-top: 0;
  transform: none;
  transition: all 0.25s;
}

/* Selected: border only slightly thicker/darker, gradient side is unchanged per request. */
.ticket-card.selected .checkbox {
  border-color: #006493;
  background: #0077b4;
}

/* Checked state — make the pink check slightly smaller while keeping the overall look. */
.checkbox.checked::after {
  content: '';
  width: 11px;
  height: 6px;
  border-left: 2.5px solid #FF4081;
  border-bottom: 2.5px solid #FF4081;
  border-radius: 1px;
  transform: rotate(-45deg) translate(1px, -1px);
  transform-origin: center;
  display: block;
}
.checkbox.hidden { display: none; }

/* 実機: チケット部分に点線（ticket_line_dots）は無い。info と footer の境界は
   .ticket-footer の上罫線（border-top 1px）だけ。旧 .ticket-notch（点線＋左右半円）は廃止。 */
/* ノッチは .ticket-inner のmaskで切り抜き、影はIPAの9-slice素材を使用する。 */

/* 区切り線は不要との指定 → border-top を削除。 */
.ticket-footer {
  padding: 14px 17px 15px 68px;
  display: flex; justify-content: space-between; align-items: center;
  position: relative;
  z-index: 2;
}
.ticket-footer::before,
.ticket-footer::after {
  content: none;
}

.ticket-type::before,
.ticket-type::after {
  content: none;
}

/* 実機比率: footer「ご来場までに…」≈ 17px（整理番号×0.77）。文字色は実機実測 #323232（旧#555は薄すぎ）。 */
.ticket-footer span { font-size: 18px; color: #323232; font-family: 'Noto Sans JP','Hiragino Sans',sans-serif; font-weight: 400; line-height: 1.1; }
.ticket-card.selected .ticket-type,
.ticket-card.selected .ticket-main,
.ticket-card.selected .checkbox-zone,
.ticket-card.selected .checkbox-zone::before,
.ticket-card.selected .checkbox-zone::after {
  border: none !important;
  box-shadow: none !important;
}

.ticket-card.selected .ticket-inner {
  border: none;
  box-shadow: none;
  outline: none;
}

.ticket-card.selected .ticket-footer span { color: #323232; }
.ticket-footer svg { fill: #8e8e8e; width: 24px; height: 24px; transform: translateY(1px); opacity: 0.92; }
.ticket-card.selected .ticket-footer svg { fill: #999; }

.ticket-card.entered .ticket-inner {
  /* ticket_base_white_used face pixel: RGBA(230,230,230,255). */
  background: #e6e6e6;
}
.ticket-card.entered .ticket-type,
.ticket-card.entered .ticket-main,
.ticket-card.entered .ticket-footer {
  background: transparent;
}
.ticket-card.entered .ticket-main {
  padding-bottom: 13px;
}
.ticket-card.entered .ticket-detail {
  line-height: 1.34;
}
.ticket-card.entered .ticket-footer {
  border-top-color: transparent;
  padding-top: 13px;
}

/* ===== BOTTOM NAV =====
   Unity Footer/Background m_Color: (218,236,248) = #DAECF8.
   Footer/Back & Footer/Next bg #DDECF7 — almost identical to footer bg, so buttons are visually flat in real app.
   Footer/{Back,Next}/Title NotoSansJP-Regular size 28 color #0074BD.
   Footer/{Back,Next}/Icon footer_arrow 48x48 color #0074BD. */
.bottom-nav-outer {
  background: #DAECF8;
  border-top: none;
  /* 実機同様だが、影はもっと控えめ。 */
  box-shadow: 0 -1px 4px rgba(0,0,0,0.12);
  position: relative;
  z-index: 30;
  /* 実機は矢印が画面端から約11px。横paddingを20px→10pxに詰める。 */
  padding: 12px 9px calc(env(safe-area-inset-bottom, 0px) + 12px);
  flex-shrink: 0;
}
.bottom-nav {
  display: flex;
  align-items: center;
  justify-content: space-between;
  background: transparent;
}
.nav-back, .nav-next {
  display: flex;
  align-items: center;
  gap: 9px;
  color: #0074BD;
  font-family: 'Noto Sans JP','Hiragino Sans',sans-serif;
  /* 実機比率(390幅で約15.2px)。15 Pro Max(430幅)では相対的に小さく見えるため 16.5px に。 */
  font-size: 16.5px;
  font-weight: 400;
  line-height: 1;
  cursor: pointer;
  user-select: none;
  transform: translateY(1px);
}
/* 実機アセット Texture2D/footer_arrow.png（元48×48）を #0074BD に着色して使用。
   旧テキスト矢印(← →)は字形が横長で実機より長く見えたため差し替え。左向きはCSSで反転。 */
.nav-back .nav-icon, .nav-next .nav-icon {
  display: flex; align-items: center; line-height: 1;
  transform: translateY(-1px);
}
.nav-back .nav-icon img, .nav-next .nav-icon img {
  width: 27px; height: 27px; display: block;
}
.nav-back .nav-icon img { transform: scaleX(-1); }

/* ===== RESPONSIVE LAYOUT OVERRIDES =====
   Mobile browser toolbars can make 31.2dvh too short and overlap the title
   with the date. This separate version protects the original proportions. */
html, body {
  min-width: 280px;
  min-height: 100%;
}
body {
  overflow-x: hidden;
  overflow-y: auto;
}
.phone {
  height: auto;
  min-height: 100dvh;
  overflow: visible;
}
.hero {
  /* 実機スクショは750px幅に対してヒーロー高が約457px（60.93%）。
     375px CSS幅では約228.5pxとなり、同一サイズで同じ比率になる。 */
  height: min(55.5556vw, 238.89px);
  min-height: 0;
  box-shadow: inset 0 -1px rgba(255,255,255,0.42);
}
.event-title {
  /* 要素ボックス内に約5pxのフォント上部余白があるため、実機の文字先端
     （750px画像の約160px地点）へ合わせてボックスを5px上へ補正。 */
  top: clamp(75px, 20vw, 108px);
  right: 8px;
  max-width: calc(100% - 16px);
  font-size: clamp(18px, 5.1vw, 22px);
  line-height: 1.35;
  overflow-wrap: anywhere;
}
.event-date, .event-time {
  right: 8px;
  max-width: calc(100% - 16px);
  font-size: clamp(16px, 4.3vw, 18px);
  line-height: 1.25;
  white-space: nowrap;
}
.ticket-section {
  min-height: 260px;
  padding-inline: clamp(7px, 2.3vw, 12px);
  overflow: visible;
}
.ticket-card {
  /* IPA has no Shadow/Outline component on EnterTicketItem. The sliced
     ticket sprite already contains the complete perimeter/notch shadow. */
  filter: none;
}
.ticket-header { gap: 10px; }
.ticket-header span {
  font-size: clamp(18px, 5.2vw, 22px);
  white-space: nowrap;
}
.ticket-main {
  padding-left: clamp(9px, 3.8vw, 15px);
  gap: clamp(7px, 2.5vw, 10px);
}
.ticket-type {
  width: 100%;
  white-space: normal;
  overflow-wrap: anywhere;
}
.checkbox-zone {
  width: clamp(48px, 17vw, 67px);
}
.ticket-footer {
  /* 実機750px画像: カード左端x16→文言左端x126（CSS換算で約55px差）。
     padding-inline は元の非対称余白を壊すため、上下・左右を個別指定する。 */
  padding: 14px clamp(13px, 4vw, 15px) 15px clamp(54px, 14.7vw, 58px);
}
.ticket-footer span {
  font-size: clamp(16px, 4.5vw, 19px);
}
.bottom-nav-outer {
  position: sticky;
  bottom: 0;
  /* 実機は上端から上方向へ、やや濃い短い影が広がる。 */
  box-shadow:
    0 -2px 5px rgba(0,0,0,0.17),
    0 -1px 1px rgba(0,0,0,0.10);
}

@media (max-width: 359px) {

<script>
/* clock removed - status bar removed */

/* ========== STATE ========== */
let isSelected  = false;
let isCheckedIn = false;

/* ========== WAVY CANVAS ========== */
function drawWavy(canvas, offset, strokeColor, whiteFill){
  const ctx = canvas.getContext('2d');
  const w = canvas.width, h = canvas.height;
  ctx.clearRect(0,0,w,h);
  ctx.save();
  ctx.beginPath();
  ctx.arc(w/2, h/2, w/2, 0, Math.PI*2);
  ctx.clip();

  /* 実機画像を再確認すると、二点リーダーの山波線は
     - 現在のモックよりも密度が高い
     - 山の横幅が少し狭い
     - 行間も少し詰まっている
     - 角は丸いというより、ややシャープ
     ため、その見え方に再調整する。 */
  /* 実機(ローチケ青入場時)の二点ポインター波線を計測して合わせた値:
       行間≈4px / 山の半周期≈3px / 線幅≈1.2px と、現状より細く密。 */
  /* 実機(ローチケ青入場時)を5xで数え直し: 円内に波線 約9本 / 1行に山 約6個 /
     線は太め / 山は高い。前回は細かすぎたので粗く取り直す。 */
  /* 実機の輝度プロファイル解析で判明: ジグザグは【二重線】。
     「白→浅い谷→白→濃いシアンの大きな谷」の繰り返し。
       ペア間隔 ≈8px / 二重線の線間 ≈2.8px / 線幅 ≈1.4px / 1行に山 ≈5個。 */
  const sH  = 9.2;   // pair spacing（二重線ペアの行間）
  const dd  = 3.0;   // line spacing within a pair（二重線の間隔）
  const zW  = 6.6;   // half period（山の横幅: 1行に約5山）
  const amp = 4.6;   // peak height
  const xOff = (offset * 6) % (zW * 2);

  /* 実機サンプル色（選択中=ピンク #FF4081 / スライド中=白） */
  ctx.strokeStyle = whiteFill ? 'rgba(255,255,255,0.96)' : (strokeColor || '#FF4081');
  ctx.lineWidth   = 1.7;   // 実機の線幅（二重線の各線）
  ctx.lineJoin    = 'miter';
  ctx.lineCap     = 'square';

  /* 各行は【二重線】: 同じジグザグを dd だけ縦にずらして2本描く。 */
  for(let row = -1; row <= Math.ceil(h / sH) + 2; row++){
    const yBase = row * sH;
    for(const off of [0, dd]){
      const y = yBase + off;
      ctx.beginPath();
      ctx.moveTo(-zW*2 + xOff, y);
      for(let x = -zW*2 + xOff; x <= w + zW*2; x += zW){
        ctx.lineTo(x + zW*0.5, y - amp);
        ctx.lineTo(x + zW,     y      );
      }
      ctx.stroke();
    }
  }
  ctx.restore();
}
let wavyOff = 0, wavyRAF = null;
let wavyStrokeColor = '#FF4081';  // 実機 marker pink (#FF4081) on blue hero
let wavyWhiteFill = false;
/* 二点ポインターは実機アセット(entry_finger_print.png)をCSSマスクで静止表示。
   描画はCSSが行うため、ここでは何もしない（色は .white-fill クラスで切替）。 */
function animateWavy(){ /* no-op: CSSマスクで静止表示 */ }
function stopWavy(){ if(wavyRAF){ cancelAnimationFrame(wavyRAF); wavyRAF=null; } }

/* ========== CHECKBOX TAP ========== */
function onTicketTap(){
  if(isCheckedIn) return;
  isSelected = !isSelected;
  const inner   = document.getElementById('ticketInner');
  const chk     = document.getElementById('checkbox');
  const warn    = document.getElementById('warningBanner');
  const cnt     = document.getElementById('ticketCount');
  const wl      = document.getElementById('wavyLeft');
  const wr      = document.getElementById('wavyRight');
  const overlay = document.getElementById('slideOverlay');

  if(isSelected){
    document.getElementById('ticketMain').style.background = '#0074bc';
    document.getElementById('ticketCard').classList.add('selected');
    chk.classList.add('checked');
    warn.style.display  = 'block';
    cnt.textContent     = '合計１／１枚';
    wl.style.display    = 'block';
    wr.style.display    = 'block';
    animateWavy();
    applyWavyBasePositions();
window.addEventListener('resize', applyWavyBasePositions);
initSlide();
  } else {
    document.getElementById('ticketCard').classList.remove('selected');
    document.getElementById('ticketMain').style.background = '';
    chk.classList.remove('checked');
    warn.style.display  = 'none';
    cnt.textContent     = '合計１枚';
    wl.style.display    = 'none';
    wr.style.display    = 'none';
    stopWavy();
    document.getElementById('circlesRainbowBg').style.display = 'none';
  }
}

/* ========== SLIDE TO CHECK-IN ========== */
let slideInited = false;
// APK: Awake() で minSwipeLength = Screen.dpi * 0.2。
// Android のCSS座標へ換算すると概ね 0.2 * 160 = 32 CSS px。
const MIN_SWIPE_LENGTH_CSS_PX = 32;
// APKの4方向判定で使われる内積しきい値（約±25度）。
const DIRECTION_DOT_THRESHOLD = 0.906;

/* ── lerp helper ── */
function lerpColor(r1,g1,b1, r2,g2,b2, t){
  return [Math.round(r1+(r2-r1)*t), Math.round(g1+(g2-g1)*t), Math.round(b1+(b2-b1)*t)];
}

function getWavyBaseLeftPx(){
  const hero = document.getElementById('hero');
  const wl   = document.getElementById('wavyLeft');
  const heroW = hero.offsetWidth;
  const wavyW = wl.offsetWidth || 68;
  return heroW * 0.3055 - (wavyW / 2);
}

function getWavyBaseRightPx(){
  const hero = document.getElementById('hero');
  const wr   = document.getElementById('wavyRight');
  const heroW = hero.offsetWidth;
  const wavyW = wr.offsetWidth || 68;
  return heroW * 0.6945 - (wavyW / 2);
}

function applyWavyBasePositions(){
  const wl = document.getElementById('wavyLeft');
  const wr = document.getElementById('wavyRight');
  wl.style.left = getWavyBaseLeftPx() + 'px';
  wr.style.left = getWavyBaseRightPx() + 'px';
}

let swipeLayerPlaceholder = null;

/* 横フリック版と同じく、元の入場バーそのものを最前面へ移して追従させる。 */
function activateSwipeImageLayer(){
  const layer = document.getElementById('swipeImageLayer');
  const source = document.querySelector('.swipe-bar-layer');
  const hero = document.getElementById('hero');
  const heroRect = hero.getBoundingClientRect();
  layer.classList.remove('is-active');
  layer.replaceChildren();

  const capture = document.createElement('div');
  capture.className = 'swipe-image-capture';
  capture.style.left = `${heroRect.left}px`;
  capture.style.top = `${heroRect.top}px`;
  capture.style.width = `${heroRect.width}px`;
  capture.style.height = `${heroRect.height}px`;
  swipeLayerPlaceholder = document.createComment('swipe-bar-layer-position');
  source.parentNode.insertBefore(swipeLayerPlaceholder, source);
  capture.appendChild(source);
  layer.appendChild(capture);

  layer.style.transition = 'none';
  layer.style.transform = 'translate3d(0,0,0)';
  layer.classList.add('is-active');
}

function deactivateSwipeImageLayer(){
  const layer = document.getElementById('swipeImageLayer');
  const source = layer.querySelector('.swipe-bar-layer');
  if(source && swipeLayerPlaceholder && swipeLayerPlaceholder.parentNode){
    swipeLayerPlaceholder.parentNode.insertBefore(source, swipeLayerPlaceholder);
    swipeLayerPlaceholder.remove();
  }
  swipeLayerPlaceholder = null;
  layer.classList.remove('is-active');
  layer.style.transition = 'none';
  layer.style.transform = 'translate3d(0,0,0)';
  layer.replaceChildren();
}

/* ── Update hero visuals based on slide progress 0→1 ── */
function updateSlideVisuals(progress, directionSign = 1){
  const layer = document.getElementById('swipeImageLayer');
  const axisDistance = progress * MIN_SWIPE_LENGTH_CSS_PX * directionSign;
  layer.style.transition = 'none';
  layer.style.transform = selectedSwipeDirection === 'vertical'
    ? `translate3d(0,${axisDistance}px,0)`
    : `translate3d(${axisDistance}px,0,0)`;
}

/* ── Reset hero visuals (slide released without completing) ── */
function resetSlideVisuals(){
  const layer = document.getElementById('swipeImageLayer');
  const wl = document.getElementById('wavyLeft');
  const wr = document.getElementById('wavyRight');
  const rb2 = document.getElementById('circlesRainbowBg');
  // APK TouchUpDetected(): 元の anchoredPosition へ 0.2 秒で戻す。
  layer.style.transition = 'transform 0.2s ease-out';
  layer.style.transform = 'translate3d(0,0,0)';
  applyWavyBasePositions();
  rb2.style.left = '0px';
  wl.style.transform = '';
  wr.style.transform = '';
  rb2.style.transform = '';
  setTimeout(()=>{
    deactivateSwipeImageLayer();
  }, 220);
}

function initSlide(){
  if(slideInited) return;
  slideInited = true;
  const hero = document.getElementById('hero');
  let dragging = false, startX = 0, startY = 0;
  let currentDx = 0, currentDy = 0, curProgress = 0;

  function getClientX(e){
    if(e.touches && e.touches.length >= 2){
      return (e.touches[0].clientX + e.touches[1].clientX) / 2;
    }
    return e.touches ? e.touches[0].clientX : e.clientX;
  }

  function getClientY(e){
    if(e.touches && e.touches.length >= 2){
      return (e.touches[0].clientY + e.touches[1].clientY) / 2;
    }
    return e.touches ? e.touches[0].clientY : e.clientY;
  }

  function onStart(e){
    if(!isSelected || isCheckedIn) return;
    // require 2 fingers for touch
    if(e.touches && e.touches.length < 2) return;
    e.preventDefault();
    dragging = true;
    startX = getClientX(e);
    startY = getClientY(e);
    currentDx = 0;
    currentDy = 0;
    curProgress = 0;
    const wl2 = document.getElementById('wavyLeft');
    const wr2 = document.getElementById('wavyRight');
    applyWavyBasePositions();
    wl2.classList.add('white-fill');
    wr2.classList.add('white-fill');
    wavyWhiteFill = true;
    animateWavy();   // 白の波線で静止描画し直す
    const rbStart = document.getElementById('circlesRainbowBg');
    rbStart.style.left = '0px';
    rbStart.style.display = 'block';
    activateSwipeImageLayer();
  }
  function onMove(e){
    if(!dragging) return;
    if(e.touches && e.touches.length < 2){ return; }
    e.preventDefault();
    currentDx = getClientX(e) - startX;
    currentDy = getClientY(e) - startY;
    const axisDistance = selectedSwipeDirection === 'vertical' ? currentDy : currentDx;
    // APK OnTouchPosition(): SwipeImageRTだけを選択軸のタッチ量へ直接追従させる。
    curProgress = Math.abs(axisDistance) / MIN_SWIPE_LENGTH_CSS_PX;
    updateSlideVisuals(curProgress, Math.sign(axisDistance) || 1);
  }
  function onEnd(){
    if(!dragging) return;
    dragging = false;
    const length = Math.hypot(currentDx, currentDy);
    const axisDot = length > 0
      ? Math.abs(selectedSwipeDirection === 'vertical' ? currentDy : currentDx) / length
      : 0;
    const completed = length >= MIN_SWIPE_LENGTH_CSS_PX && axisDot > DIRECTION_DOT_THRESHOLD;

    if(completed){
      const axisDistance = selectedSwipeDirection === 'vertical' ? currentDy : currentDx;
      const directionSign = Math.sign(axisDistance) || 1;
      const layer = document.getElementById('swipeImageLayer');
      // APK: LeanTween.moveLocalX/Y(..., 0.5f)。方向により +800 / -1500。
      // UnityのY軸は上が正、CSSのY軸は下が正なので縦だけ符号を変換する。
      const unityTarget = selectedSwipeDirection === 'vertical'
        ? (directionSign < 0 ? -800 : 1500)
        : (directionSign > 0 ? 800 : -1500);
      const canvasScale = hero.offsetWidth / 720;
      const target = unityTarget * canvasScale;
      layer.style.transition = 'transform 0.5s cubic-bezier(.4,0,.2,1)';
      if(selectedSwipeDirection === 'vertical'){
        layer.style.transform = `translate3d(0,${target}px,0)`;
      }else{
        layer.style.transform = `translate3d(${target}px,0,0)`;
      }
      setTimeout(()=>{
        doCheckIn();
        deactivateSwipeImageLayer();
      }, 500);
    }else{
      resetSlideVisuals();
      const wl3 = document.getElementById('wavyLeft');
      const wr3 = document.getElementById('wavyRight');
      wl3.classList.remove('white-fill');
      wr3.classList.remove('white-fill');
      wavyWhiteFill = false;
      animateWavy();   // ピンクの波線で静止描画し直す
      document.getElementById('circlesRainbowBg').style.display = 'none';
    }
    curProgress = 0;
    currentDx = 0;
    currentDy = 0;
  }

  hero.addEventListener('touchstart', onStart, {passive:false});
  hero.addEventListener('touchmove',  onMove,  {passive:false});
  hero.addEventListener('touchend',   onEnd,   {passive:false});
  hero.addEventListener('mousedown', onStart);
  window.addEventListener('mousemove', onMove);
  window.addEventListener('mouseup',   onEnd);
}

function ensureEntryTimeRow(){
  const detail = document.getElementById('ticketDetail');
  let row = document.getElementById('entryTimeRow');
  if(!row){
    row = document.createElement('span');
    row.id = 'entryTimeRow';
    row.className = 'entry-time';
    row.style.display = 'none';
    detail.appendChild(row);
  }
  return row;
}

/* ========== DO CHECK-IN ========== */
function doCheckIn(){
  if(isCheckedIn) return;
  isCheckedIn = true;
  isSelected = false;

  const card    = document.getElementById('ticketCard');
  const inner   = document.getElementById('ticketInner');
  const chk     = document.getElementById('checkbox');
  const stamp   = document.getElementById('nyujozumi');
  const detail  = document.getElementById('ticketDetail');
  const wl      = document.getElementById('wavyLeft');
  const wr      = document.getElementById('wavyRight');
  const overlay = document.getElementById('slideOverlay');

  // Show stamp
  stamp.style.display = 'block';
  card.classList.add('entered');

  // Add check-in time (the moment slide completed = now)
  const now = new Date();
  const pad = n => String(n).padStart(2,'0');
  const ts  = `${now.getFullYear()}/${pad(now.getMonth()+1)}/${pad(now.getDate())} ${pad(now.getHours())}:${pad(now.getMinutes())}:${pad(now.getSeconds())}`;
  const entryTimeRow = ensureEntryTimeRow();
  entryTimeRow.textContent = '入場時間：' + ts;
  entryTimeRow.style.display = 'block';

  // Revert hero and card
  document.getElementById('hero').classList.remove('selected-hero');
  document.getElementById('wavyLeft').classList.remove('white-fill');
  document.getElementById('wavyRight').classList.remove('white-fill');
  wavyWhiteFill = false;
  document.getElementById('wavyLeft').classList.remove('white-fill');
  document.getElementById('wavyRight').classList.remove('white-fill');
  document.getElementById('circlesRainbowBg').style.display = 'none';
  card.classList.remove('selected');
  inner.style.background = '';
  document.getElementById('ticketMain').style.background = '';

  // Hide checkbox zone (青ゾーンごと非表示)
  chk.classList.remove('checked');
  document.getElementById('checkboxZone').classList.add('hidden');

  // Hide wavy circles and overlay
  wl.style.display = 'none';
  wr.style.display = 'none';
  stopWavy();
  /* overlay removed */

  // Reset count, hide warning
  document.getElementById('ticketCount').textContent = '合計１枚';
  document.getElementById('warningBanner').style.display = 'none';
}

/* ========== RESET (更新ボタン) ========== */
/* ヘッダーの更新ボタンで、入場済(または選択中)の状態を最初の未選択状態へ戻す。 */
function resetEntry(){
  const card   = document.getElementById('ticketCard');
  const inner  = document.getElementById('ticketInner');
  const main   = document.getElementById('ticketMain');
  const footer = document.querySelector('.ticket-footer');
  const zone   = document.getElementById('checkboxZone');
  const chk    = document.getElementById('checkbox');
  const stamp  = document.getElementById('nyujozumi');
  const detail = document.getElementById('ticketDetail');
  const wl     = document.getElementById('wavyLeft');
  const wr     = document.getElementById('wavyRight');
  const rb     = document.getElementById('circlesRainbowBg');

  // 入場時間の行を非表示にして元の明細に戻す
  const entryTimeRow = ensureEntryTimeRow();
  entryTimeRow.textContent = '';
  entryTimeRow.style.display = 'none';

  // 状態フラグ
  isCheckedIn = false;
  isSelected  = false;

  // スタンプ・クラス
  stamp.style.display = 'none';
  card.className = 'ticket-card';

  // チェックボックス（再表示・チェック解除）
  chk.classList.remove('checked');
  zone.classList.remove('hidden');

  // 入場済/選択時に残り得るインライン描画状態を完全リセット
  [inner, main, footer, zone, chk].forEach(el => {
    if (!el) return;
    el.style.background = '';
    el.style.borderTopColor = '';
    el.style.borderColor = '';
    el.style.boxShadow = '';
    el.style.outline = '';
    el.style.filter = '';
  });

  // iOS Safari 対策:
  // mask + drop-shadow の高さ変更後に古い影/灰色枠が残ることがあるため、
  // reset時だけ filter/mask を1フレーム外して再描画させる。
  card.style.filter = 'none';
  inner.style.webkitMaskImage = 'none';
  inner.style.maskImage = 'none';
  void card.offsetHeight;
  requestAnimationFrame(() => {
    card.style.filter = '';
    inner.style.webkitMaskImage = '';
    inner.style.maskImage = '';
  });

  // 背景・件数・警告
  document.getElementById('ticketCount').textContent = '合計１枚';
  document.getElementById('warningBanner').style.display = 'none';

  // 波マーカー（非表示・初期位置へ）
  stopWavy();
  wavyWhiteFill = false;
  [wl, wr].forEach(el => {
    el.style.display = 'none';
    el.classList.remove('white-fill');
    el.style.transition = 'none';
  });
  applyWavyBasePositions();
  if(rb){ rb.style.display = 'none'; rb.style.left = '0px'; }
}

/* ====== SETTINGS ====== */
const DAYS_JP = ['日','月','火','水','木','金','土'];

function formatDate(dateStr){
  // dateStr = "2026-03-07"
  const [y,m,d] = dateStr.split('-').map(Number);
  const dow = new Date(y,m-1,d).getDay();
  const days = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  return y+'.'+String(m).padStart(2,'0')+'.'+String(d).padStart(2,'0')+'('+days[dow]+')';
}

function openSettings(){
  document.getElementById('settingsOverlay').style.display = 'block';
  const p = document.getElementById('settingsPanel');
  p.style.display = 'block';
  requestAnimationFrame(()=>{ p.style.transform = 'translateX(0)'; });
}

function closeSettings(){
  const p = document.getElementById('settingsPanel');
  p.style.transform = 'translateX(100%)';
  setTimeout(()=>{
    p.style.display = 'none';
    document.getElementById('settingsOverlay').style.display = 'none';
  }, 280);
}

function closeSettingsIfOutside(e){
  if(e.target === document.getElementById('settingsOverlay')) closeSettings();
}

let selectedHeroTheme = 'orange';
let selectedSwipeDirection = 'horizontal';

function selectSwipeDirection(direction){
  selectedSwipeDirection = direction === 'vertical' ? 'vertical' : 'horizontal';
  const select = document.getElementById('s_swipeDirection');
  if(select) select.value = selectedSwipeDirection;
}

function selectHeroTheme(theme){
  if(theme === 'gray') theme = 'white';
  if(!['original','cyan','orange','white','red','green'].includes(theme)) theme = 'orange';
  selectedHeroTheme = theme;
  document.querySelectorAll('.hero-theme-option').forEach(button => {
    const active = button.dataset.theme === theme;
    button.classList.toggle('is-active', active);
    button.setAttribute('aria-pressed', String(active));
  });
  if(document.getElementById('hero')) applyHeroTheme(theme);
}

function applyHeroTheme(theme){
  const hero = document.getElementById('hero');
  hero.classList.remove('hero-theme-original','hero-theme-cyan','hero-theme-orange','hero-theme-white','hero-theme-red','hero-theme-green','hero-theme-gray');
  hero.classList.add('hero-theme-' + theme);
  localStorage.setItem('lawtikeHeroThemeV2', theme);
}

function adjustSeatNumber(amount){
  const input = document.getElementById('s_num');
  const value = input.value;
  const match = value.match(/(\d+)(?!.*\d)/);
  const current = match ? Number(match[1]) : 0;
  const next = Math.max(1, current + amount);

  input.value = match
    ? value.slice(0, match.index) + next + value.slice(match.index + match[1].length)
    : value + next;

  /* ボタン操作時にも画面上の席番号へ即時反映する。 */
  document.getElementById('ticketNumber').textContent = input.value;
}

let seatNumberRepeatDelay = null;
let seatNumberRepeatTimer = null;
let seatNumberLongPressed = false;

function stopSeatNumberRepeat(){
  clearTimeout(seatNumberRepeatDelay);
  clearInterval(seatNumberRepeatTimer);
  seatNumberRepeatDelay = null;
  seatNumberRepeatTimer = null;
}

function startSeatNumberRepeat(event, amount){
  stopSeatNumberRepeat();
  seatNumberLongPressed = false;

  if(event.currentTarget.setPointerCapture && event.pointerId !== undefined){
    event.currentTarget.setPointerCapture(event.pointerId);
  }

  seatNumberRepeatDelay = setTimeout(() => {
    seatNumberLongPressed = true;
    adjustSeatNumber(amount);
    seatNumberRepeatTimer = setInterval(() => adjustSeatNumber(amount), 85);
  }, 450);
}

function handleSeatNumberClick(amount){
  if(seatNumberLongPressed){
    seatNumberLongPressed = false;
    return;
  }
  adjustSeatNumber(amount);
}

function toFullWidth(value){
  return value
    .replace(/[!-~]/g, char => String.fromCharCode(char.charCodeAt(0) + 0xFEE0))
    .replace(/ /g, '　');
}

function normalizeEventTitle(){
  const input = document.getElementById('s_title');
  input.value = toFullWidth(input.value);
  return input.value;
}

function applySettings(){
  applyHeroTheme(selectedHeroTheme);
  selectSwipeDirection(document.getElementById('s_swipeDirection').value);
  localStorage.setItem('lawtikeSwipeDirectionV1', selectedSwipeDirection);
  resetSlideVisuals();

  // イベント名
  const titleEl = document.getElementById('eventTitle');
  titleEl.textContent = normalizeEventTitle();

  // 日付
  const dateVal = document.getElementById('s_date').value;
  document.getElementById('eventDate').textContent = formatDate(dateVal);

  // 時刻
  document.getElementById('eventOpenTime').textContent = document.getElementById('s_open').value;
  document.getElementById('eventStartTime').textContent = document.getElementById('s_start').value;

  // チケット種類1 / 2
  document.getElementById('ticketType1').textContent = document.getElementById('s_type1').value;
  const ticketType2Val = document.getElementById('s_type2').value.trim();
  const ticketType2El = document.getElementById('ticketType2');
  ticketType2El.textContent = ticketType2Val;
  ticketType2El.style.display = ticketType2Val ? 'block' : 'none';

  // 席番号
  document.getElementById('ticketNumber').textContent = document.getElementById('s_num').value;

  // 詳細（名前・電話・金額）
  const name  = document.getElementById('s_name').value;
  const tel   = document.getElementById('s_tel').value;
  const price = document.getElementById('s_price').value;
  const oldEntryRow = document.getElementById('entryTimeRow');
  const oldEntryText = oldEntryRow ? oldEntryRow.textContent : '';
  const oldEntryVisible = oldEntryRow && oldEntryRow.style.display !== 'none';

  const detailEl = document.getElementById('ticketDetail');
  detailEl.innerHTML =
    name + '様<br>' + tel + '<br>' + price +
    '<span class="entry-time" id="entryTimeRow" style="display:none;"></span>';

  const newEntryRow = ensureEntryTimeRow();
  newEntryRow.textContent = oldEntryText;
  newEntryRow.style.display = oldEntryVisible ? 'block' : 'none';

  closeSettings();
}

/* APK 2.1.47 ScreenEntry.CopyProtectAnimation:
   Instantiate every 1.0s, scale/alpha for 2.0s, then DestroyImmediate. */
let rippleSpawnTimer = null;

/* IPA NetworkCheckController mapping:
   - Application.internetReachability == NotReachable
   - TIME_OUT = 1 second
   Web/PWA equivalent uses the device/browser reachability flag only. No probe
   request is sent, preserving this mock's no-external-communication behavior. */
let networkCheckTimer = null;

function updateNetworkCheckBar(){
  const bar = document.getElementById('networkCheckBar');
  if(!bar) return;
  const isOffline = navigator.onLine === false;
  bar.classList.toggle('is-visible', isOffline);
  bar.setAttribute('aria-hidden', isOffline ? 'false' : 'true');
}

function startNetworkCheck(){
  if(networkCheckTimer !== null) window.clearInterval(networkCheckTimer);
  updateNetworkCheckBar();
  networkCheckTimer = window.setInterval(updateNetworkCheckBar, 1000);
}

window.addEventListener('online', updateNetworkCheckBar);
window.addEventListener('offline', updateNetworkCheckBar);
window.addEventListener('pageshow', updateNetworkCheckBar);
document.addEventListener('visibilitychange', () => {
  if(!document.hidden) updateNetworkCheckBar();
});

function spawnCopyProtectRipple(){
  const container = document.getElementById('rippleContainer');
  if(!container) return;

  const ring = document.createElement('div');
  ring.className = 'ripple-ring';
  container.appendChild(ring);

  window.setTimeout(() => ring.remove(), 2000);
}

function startCopyProtectAnimation(){
  if(rippleSpawnTimer !== null) window.clearInterval(rippleSpawnTimer);
  const container = document.getElementById('rippleContainer');
  if(container) container.replaceChildren();
  spawnCopyProtectRipple();
  rippleSpawnTimer = window.setInterval(spawnCopyProtectRipple, 1000);
}

document.addEventListener('DOMContentLoaded', () => {
  startNetworkCheck();
  startCopyProtectAnimation();
  const savedTheme = localStorage.getItem('lawtikeHeroThemeV2');
  selectHeroTheme(['original','cyan','orange','white','red','green','gray'].includes(savedTheme) ? savedTheme : 'orange');
  applyHeroTheme(selectedHeroTheme);

  const savedSwipeDirection = localStorage.getItem('lawtikeSwipeDirectionV1');
  selectSwipeDirection(savedSwipeDirection === 'vertical' ? 'vertical' : 'horizontal');

  const ticketType2El = document.getElementById('ticketType2');
  if (ticketType2El && !ticketType2El.textContent.trim()) {
    ticketType2El.style.display = 'none';
  }
});
